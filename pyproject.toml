[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emotians"
version = "0.1.0"
description = "From-scratch real-time facial-expression recognition prototype"
requires-python = ">=3.10"
dependencies = [
  "opencv-python>=4.10,<5",
  "numpy>=1.26,<3",
  "PyYAML>=6,<7",
  "torch>=2.5",
  "kagglehub>=0.3",
  "tqdm>=4.66,<5",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
emotians = "emotians.app:main"
emotians-web = "emotians.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
